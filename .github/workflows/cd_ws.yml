name: Deploy the websocket
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.ws
          push: true
          tags: adityajha02/draw-app-ws-backend:${{ github.sha }}
          
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          chmod 700 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@${{ secrets.EC2_HOST }} "sudo docker rm -f draw-app_ws-backend || true && sudo docker run --name draw-app_ws-backend --restart unless-stopped -d -p 8080:8080 -e DATABASE_URL='${{ secrets.DATABASE_URL }}' adityajha02/draw-app-ws-backend:${{ github.sha }}"