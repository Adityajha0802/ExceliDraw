name: Deploy the frontend
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXT_PUBLIC_BACKEND_URL=http://${{ secrets.EC2_HOST }}/api
            NEXT_PUBLIC_WS_URL=ws://${{ secrets.EC2_HOST }}/ws
          push: true
          tags: adityajha02/draw-app-frontend:${{ github.sha }}
          
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          chmod 700 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@${{ secrets.EC2_HOST }} "sudo docker rm -f draw-app_frontend || true && sudo docker run --name draw-app_frontend -d -p 3001:3001 adityajha02/draw-app-frontend:${{ github.sha }}"
